services:
  # Single entry point: route /api and /auth to API, everything else to web.
  # In Dokploy Domains tab, point your domain (e.g. pm.aient.co) at this service, port 80.
  plane-proxy:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - plane-web
      - plane-api
    networks:
      - default
      - dokploy-network

  plane-web:
    image: makeplane/plane-frontend:stable
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=https://${PLANE_DOMAIN}
    depends_on:
      - plane-api
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # Catch-all: serve frontend for this host (lower priority so /api and /auth hit API first)
      - "traefik.http.routers.plane-web.rule=Host(`${PLANE_DOMAIN}`)"
      - "traefik.http.routers.plane-web.priority=1"
      - "traefik.http.routers.plane-web.entrypoints=websecure"
      - "traefik.http.routers.plane-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-web.loadbalancer.server.port=3000"

  plane-api:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    ports:
      - "8000"
    networks:
      - default
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # /api and /auth must hit the backend (higher priority than web)
      - "traefik.http.routers.plane-api.rule=Host(`${PLANE_DOMAIN}`) && (PathPrefix(`/api`) || PathPrefix(`/auth`))"
      - "traefik.http.routers.plane-api.priority=10"
      - "traefik.http.routers.plane-api.entrypoints=websecure"
      - "traefik.http.routers.plane-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.plane-api.loadbalancer.server.port=8000"
    environment:
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - DATABASE_URL=postgresql://plane:${DB_PASSWORD}@plane-db:5432/plane
      - REDIS_URL=redis://plane-redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=https://${PLANE_DOMAIN}
      - WEB_URL=https://${PLANE_DOMAIN}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - AWS_REGION=us-east-1
      - USE_MINIO=1
      - RABBITMQ_HOST=plane-mq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-plane}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-plane}
    volumes:
      - plane-logs:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  plane-worker:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    environment:
      - DATABASE_URL=postgresql://plane:${DB_PASSWORD}@plane-db:5432/plane
      - REDIS_URL=redis://plane-redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-uploads}
      - AWS_REGION=us-east-1
      - USE_MINIO=1
      - RABBITMQ_HOST=plane-mq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-plane}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-plane}
    volumes:
      - plane-logs-worker:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy

  plane-migrator:
    image: makeplane/plane-backend:stable
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    environment:
      - DATABASE_URL=postgresql://plane:${DB_PASSWORD}@plane-db:5432/plane
      - REDIS_URL=redis://plane-redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - RABBITMQ_HOST=plane-mq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-plane}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-plane}
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  plane-beat:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    environment:
      - DATABASE_URL=postgresql://plane:${DB_PASSWORD}@plane-db:5432/plane
      - REDIS_URL=redis://plane-redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - RABBITMQ_HOST=plane-mq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-plane}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-plane}
    volumes:
      - plane-logs-beat:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy

  plane-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=plane
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - plane-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane"]
      interval: 10s
      timeout: 5s
      retries: 5

  plane-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - plane-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  plane-mq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-plane}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-plane}
    volumes:
      - plane-mq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  plane-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - plane-minio-data:/data

networks:
  dokploy-network:
    external: true

volumes:
  plane-db-data:
  plane-redis-data:
  plane-mq-data:
  plane-minio-data:
  plane-logs:
  plane-logs-worker:
  plane-logs-beat:
