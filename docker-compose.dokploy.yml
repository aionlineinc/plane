services:
  plane-web:
    image: makeplane/plane-frontend:stable
    restart: unless-stopped
    ports:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=https://${PLANE_DOMAIN}
    depends_on:
      - plane-api

  plane-api:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    ports:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://plane:${DB_PASSWORD}@plane-db:5432/plane
      - REDIS_URL=redis://plane-redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=https://${PLANE_DOMAIN}
      - WEB_URL=https://${PLANE_DOMAIN}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_S3_BUCKET_NAME=plane-uploads
      - AWS_REGION=us-east-1
      - USE_MINIO=1
    volumes:
      - ../files/plane-logs:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  plane-worker:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    command: ["celery", "-A", "plane", "worker", "-l", "info"]
    environment:
      - DATABASE_URL=postgresql://plane:${DB_PASSWORD}@plane-db:5432/plane
      - REDIS_URL=redis://plane-redis:6379
      - SECRET_KEY=${SECRET_KEY}
      - AWS_S3_ENDPOINT_URL=http://plane-minio:9000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_S3_BUCKET_NAME=plane-uploads
      - AWS_REGION=us-east-1
      - USE_MINIO=1
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  plane-beat:
    image: makeplane/plane-backend:stable
    restart: unless-stopped
    command: ["celery", "-A", "plane", "beat", "-l", "info"]
    environment:
      - DATABASE_URL=postgresql://plane:${DB_PASSWORD}@plane-db:5432/plane
      - REDIS_URL=redis://plane-redis:6379
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy

  plane-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=plane
      - POSTGRES_USER=plane
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - ../files/plane-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plane"]
      interval: 10s
      timeout: 5s
      retries: 5

  plane-redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  plane-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ../files/plane-minio-data:/data
