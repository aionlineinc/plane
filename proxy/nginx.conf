# Single entry point: route /api and /auth to backend, everything else to frontend.
# Point your domain (e.g. in Dokploy Domains tab) at this proxy, port 80.
# If you get 405: check response headers for X-Served-By: plane-proxy (then request did reach proxy).

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Backend (Django API) – /auth and /api (with or without trailing slash)
    location ~ ^/auth(/|$) {
        proxy_pass http://plane-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By "plane-proxy-api";
    }

    location ~ ^/api(/|$) {
        proxy_pass http://plane-api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Served-By "plane-proxy-api";
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://plane-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header X-Served-By "plane-proxy-web";
    }
}
